databases:
  - name: lotrkdb-postgres
    databaseName: lotrkdb
    user: lotrkdb
    plan: free
    region: singapore
    ipAllowList: []

services:
  - type: web
    name: lotrkdb
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_STORAGE_PROVIDER
        value: render
      - key: NODE_VERSION
        value: "22"
      # External Neon connection is maintained as a server-only secret in Render.
      # Retain the original database resource until migration verification is complete.
      - key: DATABASE_URL
        sync: false
