name: Check Render availability

on:
  schedule:
    # Offset the schedule from minute zero. GitHub may delay scheduled jobs.
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/render-availability.yml]

permissions: {}

concurrency:
  group: render-availability
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request the deployed API and verify PostgreSQL readiness
        env:
          HEALTH_URL: https://lotrkdb.onrender.com/api/health
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          for attempt in range(3):
              try:
                  request = urllib.request.Request(
                      os.environ["HEALTH_URL"],
                      headers={"User-Agent": "LOTRKDB-Availability-Check", "Cache-Control": "no-cache"},
                  )
                  with urllib.request.urlopen(request, timeout=80) as response:
                      if response.status != 200:
                          raise RuntimeError(f"HTTP {response.status}")
                      result = json.load(response)
                  if result.get("status") != "ok" or result.get("database") != "connected":
                      raise RuntimeError("API or PostgreSQL is not ready")
                  print("Render API returned HTTP 200; PostgreSQL connected.")
                  break
              except Exception as error:
                  print(f"Availability check {attempt + 1}/3 failed: {error}")
                  if attempt == 2:
                      raise
                  time.sleep(10)
          PY
